<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" font-family="ui-sans-serif,system-ui,sans-serif" role="img" aria-label="Funds locked in escrow are released after a human review step">
  <defs><marker id="b" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#94a3b8"/></marker></defs>
  <rect x="20" y="70" width="180" height="70" rx="12" fill="#15803D"/>
  <text x="110" y="100" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Locked in escrow</text>
  <text x="110" y="120" fill="#dcfce7" font-size="11" text-anchor="middle">on-chain, on Stellar</text>
  <rect x="290" y="70" width="180" height="70" rx="12" fill="#334155"/>
  <text x="380" y="95" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Human review</text>
  <text x="380" y="114" fill="#cbd5e1" font-size="10.5" text-anchor="middle">organizer · panel ·</text>
  <text x="380" y="128" fill="#cbd5e1" font-size="10.5" text-anchor="middle">reviewer · vote</text>
  <rect x="560" y="70" width="180" height="70" rx="12" fill="#85d82c"/>
  <text x="650" y="100" fill="#14320a" font-size="15" font-weight="700" text-anchor="middle">Released to wallet</text>
  <text x="650" y="120" fill="#14320a" font-size="11" text-anchor="middle">in USDC</text>
  <line x1="202" y1="105" x2="286" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#b)"/>
  <line x1="472" y1="105" x2="556" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#b)"/>
  <text x="380" y="40" fill="#64748b" font-size="13" font-weight="600" text-anchor="middle">Code enforces what was decided · people decide what counts</text>
</svg>
