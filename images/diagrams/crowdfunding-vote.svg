<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" font-family="ui-sans-serif,system-ui,sans-serif" role="img" aria-label="A crowdfunding campaign must pass a community vote before it can launch">
  <defs><marker id="e" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#7a8f8b"/></marker></defs>
  <rect x="20" y="60" width="150" height="60" rx="11" fill="#2c3a37"/>
  <text x="95" y="95" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Submitted</text>
  <rect x="245" y="45" width="200" height="90" rx="11" fill="#19825e"/>
  <text x="345" y="78" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Community vote</text>
  <text x="345" y="99" fill="#bef9e5" font-size="11" text-anchor="middle">quorum: 10 votes</text>
  <text x="345" y="115" fill="#bef9e5" font-size="11" text-anchor="middle">threshold: 60% in favor</text>
  <rect x="520" y="60" width="160" height="60" rx="11" fill="#2eedaa"/>
  <text x="600" y="88" fill="#08352a" font-size="14" font-weight="700" text-anchor="middle">Launches</text>
  <text x="600" y="107" fill="#08352a" font-size="11" text-anchor="middle">on-chain funding opens</text>
  <line x1="172" y1="90" x2="241" y2="90" stroke="#7a8f8b" stroke-width="2" marker-end="url(#e)"/>
  <line x1="447" y1="90" x2="516" y2="90" stroke="#7a8f8b" stroke-width="2" marker-end="url(#e)"/>
  <text x="482" y="80" fill="#5c6f6b" font-size="10.5" text-anchor="middle">passes</text>
</svg>
