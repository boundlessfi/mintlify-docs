<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" font-family="ui-sans-serif,system-ui,sans-serif" role="img" aria-label="Each crowdfunding milestone releases remaining escrow divided by remaining milestones">
  <rect x="60" y="70" width="150" height="70" rx="12" fill="#334155"/>
  <text x="135" y="100" fill="#fff" font-size="13" text-anchor="middle">Raised</text>
  <text x="135" y="122" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">4,200 USDC</text>
  <text x="300" y="100" fill="#64748b" font-size="20" font-weight="700" text-anchor="middle">÷</text>
  <rect x="360" y="70" width="170" height="70" rx="12" fill="#15803D"/>
  <text x="445" y="100" fill="#fff" font-size="13" text-anchor="middle">Remaining milestones</text>
  <text x="445" y="122" fill="#dcfce7" font-size="18" font-weight="700" text-anchor="middle">3</text>
  <text x="565" y="100" fill="#64748b" font-size="20" font-weight="700" text-anchor="middle">=</text>
  <rect x="595" y="70" width="110" height="70" rx="12" fill="#85d82c"/>
  <text x="650" y="100" fill="#14320a" font-size="13" text-anchor="middle">1st claim</text>
  <text x="650" y="122" fill="#14320a" font-size="16" font-weight="700" text-anchor="middle">1,400</text>
  <text x="360" y="34" fill="#64748b" font-size="13" font-weight="600" text-anchor="middle">Each milestone releases: remaining escrow ÷ remaining milestones</text>
  <text x="360" y="168" fill="#64748b" font-size="11" text-anchor="middle">The share is recalculated at each claim; the last milestone takes any remainder</text>
</svg>
