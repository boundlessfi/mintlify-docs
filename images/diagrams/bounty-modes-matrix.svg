<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" font-family="ui-sans-serif,system-ui,sans-serif" role="img" aria-label="Bounty mode matrix: entry type by selection type">
  <text x="350" y="24" fill="#5c6f6b" font-size="13" font-weight="600" text-anchor="middle">A mode = entry type  ×  selection</text>
  <text x="240" y="70" fill="#5c6f6b" font-size="13" font-weight="700" text-anchor="middle">Single claim</text>
  <text x="490" y="70" fill="#5c6f6b" font-size="13" font-weight="700" text-anchor="middle">Competition</text>
  <text x="18" y="118" fill="#5c6f6b" font-size="12.5" font-weight="700" text-anchor="start">Open</text>
  <text x="18" y="178" fill="#5c6f6b" font-size="12.5" font-weight="700" text-anchor="start">Application</text>
  <text x="18" y="192" fill="#5c6f6b" font-size="12.5" font-weight="700" text-anchor="start">(light)</text>
  <text x="18" y="238" fill="#5c6f6b" font-size="12.5" font-weight="700" text-anchor="start">Application</text>
  <text x="18" y="252" fill="#5c6f6b" font-size="12.5" font-weight="700" text-anchor="start">(full)</text>
  <g fill="#19825e">
    <rect x="150" y="90"  width="190" height="44" rx="9"/>
    <rect x="150" y="150" width="190" height="44" rx="9"/>
    <rect x="150" y="210" width="190" height="44" rx="9"/>
  </g>
  <g fill="#2eedaa">
    <rect x="400" y="90"  width="190" height="44" rx="9"/>
    <rect x="400" y="150" width="190" height="44" rx="9"/>
    <rect x="400" y="210" width="190" height="44" rx="9"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="245" y="117" fill="#fff">Start right away</text>
    <text x="245" y="177" fill="#fff">Apply, then chosen</text>
    <text x="245" y="237" fill="#fff">Propose, then chosen</text>
    <text x="495" y="117" fill="#08352a">Open, best wins</text>
    <text x="495" y="177" fill="#08352a">Shortlist, best wins</text>
    <text x="495" y="237" fill="#08352a">Proposal, best wins</text>
  </g>
</svg>
