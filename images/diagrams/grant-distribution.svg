<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="ui-sans-serif,system-ui,sans-serif" role="img" aria-label="Three grants of different sizes within a 2,000 to 10,000 USDC range, each split into equal milestone payments">
  <text x="300" y="26" fill="#5c6f6b" font-size="13" font-weight="600" text-anchor="middle">Up to 8 grants of 2,000 to 10,000 USDC, each paid in equal milestones</text>
  <g font-size="12" fill="#5c6f6b">
    <text x="40" y="70">Ada</text>
    <text x="40" y="130">Bayo</text>
    <text x="40" y="190">Chidi</text>
  </g>
  <g>
    <rect x="100" y="52" width="450" height="28" rx="8" fill="#19825e"/>
    <rect x="100" y="112" width="270" height="28" rx="8" fill="#21a879"/>
    <rect x="100" y="172" width="90" height="28" rx="8" fill="#2eedaa"/>
  </g>
  <g stroke="#ffffff" stroke-width="2">
    <line x1="250" y1="52" x2="250" y2="80"/>
    <line x1="400" y1="52" x2="400" y2="80"/>
    <line x1="190" y1="112" x2="190" y2="140"/>
    <line x1="280" y1="112" x2="280" y2="140"/>
    <line x1="130" y1="172" x2="130" y2="200"/>
    <line x1="160" y1="172" x2="160" y2="200"/>
  </g>
  <g font-size="12" font-weight="700">
    <text x="556" y="70" fill="#19825e">10,000</text>
    <text x="376" y="130" fill="#21a879">6,000</text>
    <text x="196" y="190" fill="#19825e">2,000</text>
  </g>
  <text x="300" y="236" fill="#5c6f6b" font-size="11" text-anchor="middle">Each recipient's amount is agreed at approval; every milestone releases one equal part</text>
</svg>
