<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" font-family="ui-sans-serif,system-ui,sans-serif" role="img" aria-label="Competition bounty timeline: build, deadline, judge, settle">
  <line x1="30" y1="95" x2="730" y2="95" stroke="#c2d0cd" stroke-width="3"/>
  <circle cx="90"  cy="95" r="9" fill="#2c3a37"/>
  <circle cx="300" cy="95" r="9" fill="#19825e"/>
  <circle cx="500" cy="95" r="9" fill="#19825e"/>
  <circle cx="690" cy="95" r="9" fill="#2eedaa"/>
  <g font-size="13" font-weight="700" fill="#2c3a37" text-anchor="middle">
    <text x="90"  y="55">Build</text>
    <text x="300" y="55">Deadline</text>
    <text x="500" y="55">Judge</text>
    <text x="690" y="55">Settle</text>
  </g>
  <g font-size="10.5" fill="#5c6f6b" text-anchor="middle">
    <text x="90"  y="72">everyone submits</text>
    <text x="300" y="72">entries compared</text>
    <text x="500" y="72">pick winners &amp; tiers</text>
    <text x="690" y="72">paid in USDC</text>
  </g>
  <text x="380" y="135" fill="#5c6f6b" font-size="11" text-anchor="middle">In a competition, several people work in parallel and the best submission wins</text>
</svg>
