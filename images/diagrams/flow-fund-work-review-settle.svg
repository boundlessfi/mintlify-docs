<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" font-family="ui-sans-serif,system-ui,sans-serif" role="img" aria-label="The four-step Boundless flow: Fund, Work, Review, Settle">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="#7a8f8b"/></marker></defs>
  <g>
    <rect x="10"  y="40" width="160" height="72" rx="12" fill="#19825e"/>
    <rect x="210" y="40" width="160" height="72" rx="12" fill="#19825e"/>
    <rect x="410" y="40" width="160" height="72" rx="12" fill="#19825e"/>
    <rect x="610" y="40" width="140" height="72" rx="12" fill="#2eedaa"/>
    <line x1="172" y1="76" x2="206" y2="76" stroke="#7a8f8b" stroke-width="2" marker-end="url(#a)"/>
    <line x1="372" y1="76" x2="406" y2="76" stroke="#7a8f8b" stroke-width="2" marker-end="url(#a)"/>
    <line x1="572" y1="76" x2="606" y2="76" stroke="#7a8f8b" stroke-width="2" marker-end="url(#a)"/>
    <text x="90"  y="70" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">1 · Fund</text>
    <text x="90"  y="92" fill="#bef9e5" font-size="11" text-anchor="middle">Budget locked in escrow</text>
    <text x="290" y="70" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">2 · Work</text>
    <text x="290" y="92" fill="#bef9e5" font-size="11" text-anchor="middle">Contributors deliver</text>
    <text x="490" y="70" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">3 · Review</text>
    <text x="490" y="92" fill="#bef9e5" font-size="11" text-anchor="middle">A human decides</text>
    <text x="680" y="70" fill="#08352a" font-size="17" font-weight="700" text-anchor="middle">4 · Settle</text>
    <text x="680" y="92" fill="#08352a" font-size="11" text-anchor="middle">Paid in USDC ~1 min</text>
  </g>
</svg>
